<script>
  // Saved look (palette, layout, dark mode) applied before first paint (no flash).
  (function () { try { var h = document.documentElement, u = JSON.parse(localStorage.getItem("rekev-ui") || "{}"), pal = u.pal === "greek" ? "navygold" : (u.pal || "classic");
    h.setAttribute("data-pal", pal); if (u.layout === "gm") h.classList.add("gm"); if (localStorage.getItem("rekev-hdr") === "1") h.classList.add("hdr-min");
    if (localStorage.getItem("rekev-theme") === "dark") h.classList.add("dark"); } catch (e) {} })();
</script>
<script>
  // On-device debug console (from rek-tracker): captures console output and errors so problems can be read on a phone.
  (function () {
    const logs = [];
    const str = a => a instanceof Error ? a.name + ": " + a.message : (typeof a === "object" ? (function () { try { return JSON.stringify(a); } catch (e) { return String(a); } })() : String(a));
    const draw = () => { const p = document.getElementById("debugPanel"); if (p) p.textContent = logs.slice(-300).join("\n"); };
    const push = (k, args) => { logs.push("[" + new Date().toLocaleTimeString() + "] [" + k + "] " + Array.from(args).map(str).join(" ")); draw(); };
    ["log", "warn", "error"].forEach(k => { const o = console[k]; console[k] = function () { push(k, arguments); o.apply(console, arguments); }; });
    window.addEventListener("error", e => push("window.onerror", [(e.message || "Script error") + " @ " + (e.filename || "?") + ":" + (e.lineno || "?")]));
    window.addEventListener("unhandledrejection", e => push("unhandledrejection", [e.reason]));
    window.addEventListener("DOMContentLoaded", () => {
      const b = document.getElementById("debugToggleBtn"), p = document.getElementById("debugPanel");
      if (b && p) b.addEventListener("click", () => { p.style.display = p.style.display === "none" ? "block" : "none"; draw(); });
    });
  })();
</script>

<style>

// ---------------- Rules (defaults live in code, overrides in /eval/rules) ----------------
const DEF_TASK = { doneOnTime: 1, doneLateExcused: 1, doneLateNoExcuse: 0, notDoneExcused: 0, notDoneNoExcuse: -1 };

const LEADERS = ["chairman", "vicechair"];   // all committees
// Heads issue tasks and attendance events for their own committee and enter the quality check; HR does the checking (My Group).
const HEAD_P = { committee: "write", tasks: "write", att: "write", rules: "read", sheets: "read" };
const LEAD_P = { team: "write", committee: "write", assign: "read", tasks: "write", att: "write", members: "read", rules: "read", sheets: "read" };

  hr: { mygroup: "write", team: "read", committee: "read", tasks: "read", att: "read", members: "write", sheets: "read" },   // HR does not see the scoring rules
  head: HEAD_P, vicehead: HEAD_P,

  if (!u.permissions) return defaultPerms(u.role);

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

function bootstrapOpen() { return !Object.keys(S.passkeys).some(id => id !== "TRYME1" && (S.passkeys[id] || {}).role === "admin"); }
function userFromRecord(id) {

function tryAuth(id) {

$("#authForm").addEventListener("submit", e => {

  if (S.passkeys[id] && S.loaded.passkeys) { if (!tryAuth(id)) fail(); return; }

  const timeout = setTimeout(() => { btn.disabled = false; btn.textContent = "Continue"; showSyncError(new Error("Timed out waiting for the database. Check the connection status above.")); }, 8000);

  const up = {}; ["members", "events", "tasks", "taskRecords", "attRecords", "bonuses", "decisions"].forEach(k => Object.keys(S[k]).forEach(id => { up[k + "/" + id] = null; }));
  Object.keys(S.passkeys).forEach(id => { if (id !== "TRYME1") up["passkeys/" + id] = null; }); Object.keys(S.assignments).forEach(id => { up["assignments/" + id] = null; });
  W(R("").update(up)).then(() => toast("Reset done"));
}

function memberForm(id) {
  if (!canWrite("members")) return deny();

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) { if (e.target.id === "modal") closeModal(); return; }
  if (a.tagName === "SELECT") return;
  const f = ACT[a.dataset.act]; if (f) f(a.dataset, a, e);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === "commSel") { S.sel.comm = t.value; render(); return; }
  if (t.dataset && t.dataset.sel) { S.sel[t.dataset.sel] = t.value; render(); return; }
  if (t.dataset && t.dataset.setting) { if (S.user && S.user.role === "admin") W(R("settings/" + t.dataset.setting).set(t.value.trim() || null)); return; }
  if (t.id === "importFile") { const file = t.files && t.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => importJson(String(rd.result)); rd.readAsText(file); t.value = ""; return; }
  if (t.dataset && t.dataset.kind === "rule") {
    if (!canWrite("rules")) return deny();
    const v = t.value.trim(), p = t.dataset.path; let val = v === "" ? null : Number(v);
    if (val !== null && !isFinite(val)) { toast("Rules must be numbers."); return; }
    if (p === "ediPenalty" && val !== null) val = Math.max(0, Math.min(1, val));
    W(R("rules/" + p).set(val)).then(() => log("Rule " + p + " = " + val)); return;
  }
  if (t.dataset && (t.dataset.kind === "t" || t.dataset.kind === "e") && t.dataset.f) {
    const v = t.type === "checkbox" ? t.checked : t.value, patch = {}; patch[t.dataset.f] = v;
    (t.dataset.kind === "t" ? setTaskRec : setAttRec)(t.dataset.a, t.dataset.m, patch);
  }
});

const PALETTES = [
  ["classic", "Classic", "Navy & slate, light or dark", ["#0F172A", "#1E3A8A", "#F8FAFC", "#16A34A"]],
  ["olive", "Off-white & dark green", "Warm paper, deep green", ["#1E4A38", "#2D6A4F", "#F3F0E6", "#FBF9F2"]],

function gm() { return document.documentElement.classList.contains("gm"); }
function applyUI() {

  shield: ["########", "#......#", "#......#", "#......#", ".#....#.", "..#..#..", "...##...", "........"],
  heart: [".##..##.", "########", "########", "########", ".######.", "..####..", "...##...", "........"],

const TAB_ICON = { team: "trophy", committee: "shield", mygroup: "heart", assign: "flag", tasks: "scroll", att: "star", members: "face", rules: "book", sheets: "chest", access: "key" };
function pxIcon(name) {
  const g = ICONS[name]; if (!g) return "";
  let r = ""; g.forEach((row, y) => { for (let x = 0; x < 8; x++) if (row[x] === "#") r += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>'; });
  return '<svg class="pxi" viewBox="0 0 8 8" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">' + r + "</svg>";
}
function gmIcons() { return gm() && UI.icons !== "off"; }
function applyHdr() { const min = document.documentElement.classList.contains("hdr-min"), b = $("#hdrArrow"); if (b) { b.setAttribute("aria-expanded", min ? "false" : "true"); b.title = min ? "Show buttons" : "Hide buttons"; } }
let lastLevel = null;
function updateXp() {            // XP = points from completed task/attendance evaluations of the members this user can see; a level every 50 XP
  const el = $("#xpHud"); if (!el || !S.user) return;
  let rows = compute().memberRows; const sc = myScope();
  if (sc) rows = rows.filter(r => r.committee === sc);
  else if (S.user.role === "hr") { const ids = {}; myCohort().forEach(m => { ids[m.id] = 1; }); rows = rows.filter(r => ids[r.id]); }
  const xp = Math.max(0, Math.round(rows.reduce((n, r) => n + (Number(r.xpPts) || 0), 0))), lvl = Math.floor(xp / 50) + 1, cur = xp % 50;
  el.innerHTML = '<span class="xp-lv">LV ' + lvl + '</span><span class="xp-bar"><i style="width:' + (cur / 50 * 100) + '%"></i></span><span class="xp-num">' + xp + " XP</span>";
  if (gm() && lastLevel !== null && lvl > lastLevel) toast("LEVEL UP! You reached LV " + lvl);
  lastLevel = lvl;
}
function openCustomize() {
  const seg = (k, opts) => '<div class="seg">' + opts.map(o => '<button type="button" class="segb' + (UI[k] === o[0] ? " on" : "") + '" data-act="uiSet" data-k="' + k + '" data-v="' + o[0] + '">' + o[1] + "</button>").join("") + "</div>";
  const dark = document.documentElement.classList.contains("dark");
  $("#modal").innerHTML = '<div class="m-card"><h3 class="disp" style="font-size:20px">Customize</h3>' +
    '<div class="cust-h">Layout</div>' + seg("layout", [["std", "Standard"], ["gm", "Game mode (pixel)"]]) +
    '<div class="cust-h">Palette</div><div class="pal-grid">' + PALETTES.map(p => '<button type="button" class="palc' + (UI.pal === p[0] ? " on" : "") + '" data-act="uiSet" data-k="pal" data-v="' + p[0] + '"><span class="chips">' + p[3].map(c => '<i style="background:' + c + '"></i>').join("") + '</span><span><b>' + p[1] + '</b><span class="meta">' + p[2] + "</span></span></button>").join("") + "</div>" +
    '<div class="cust-h">Light / dark mode</div><div class="seg"><button type="button" class="segb' + (dark ? "" : " on") + '" data-act="uiTheme" data-v="light">Light</button><button type="button" class="segb' + (dark ? " on" : "") + '" data-act="uiTheme" data-v="dark">Dark</button></div>' +
    '<div class="cust-h">Pixel icons on the panel tabs (Game mode)</div>' + seg("icons", [["on", "On"], ["off", "Off"]]) +

  $("#modal").classList.remove("hidden");
}

  ACT: ACT, tryAuth: tryAuth, effPerms: effPerms, canWrite: canWrite, canMark: canMark, canQC: canQC, setTaskRec: setTaskRec, setAttRec: setAttRec, saveMember: saveMember, saveTask: saveTask, saveEvent: saveEvent, addBonus: addBonus, deleteItem: deleteItem, saveCohort: saveCohort, distributeUnassigned: distributeUnassigned, myCohort: myCohort, cohortOf: cohortOf, bootstrapOpen: bootstrapOpen, closeTerm: closeTerm, importJson: importJson, renderAll: renderAll, VIEWS: VIEWS, signOut: signOut, committees: committees };
